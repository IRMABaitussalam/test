{{ define "main" }}
<article class="page-gallery">
  <header class="page-header reveal">
    <p class="section-kicker"><i class="fa-solid fa-images"></i> Galeri</p>
    <h1>{{ .Title }}</h1>
    {{ partial "divider.html" . }}
    {{ with .Content }}<div class="page-description">{{ . }}</div>{{ end }}
  </header>

  <div class="gallery-grid">
    {{ range $i, $img := .Site.Data.galeri }}
      <figure class="gallery-item reveal {{ if eq (mod $i 3) 1 }}delay-1{{ else if eq (mod $i 3) 2 }}delay-2{{ end }}"
              data-src="{{ $img.src }}"
              data-caption="{{ $img.caption }}"
              data-date="{{ $img.date | default "" }}">
        <img src="{{ $img.src }}" alt="{{ $img.caption }}" loading="lazy">
        <span class="gallery-overlay" aria-hidden="true">
          <i class="fa-solid fa-expand"></i>
        </span>
        <figcaption>{{ $img.caption }}</figcaption>
      </figure>
    {{ end }}
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau gambar">
    <button class="lightbox-close" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    <div class="lightbox-counter" aria-live="polite">1 / 1</div>
    <button class="lightbox-prev" aria-label="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="lightbox-next" aria-label="Berikutnya"><i class="fa-solid fa-chevron-right"></i></button>
    <img class="lightbox-img" src="" alt="">
    <div class="lightbox-info">
      <p class="lightbox-caption"></p>
      <p class="lightbox-date"></p>
    </div>
  </div>
</article>
{{ end }}
